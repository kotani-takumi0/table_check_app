# Swift 版 iOS アプリの Xcode プロジェクトの設計図。XcodeGen で Minopal.xcodeproj を作る（npm run ios-swift:open）。
# Minopal.xcodeproj は作り直せるのでリポジトリに入れない。設定を変えるときは Xcode ではなくこのファイルを直す
name: Minopal
options:
  bundleIdPrefix: jp.minopal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MinopalCore:
    path: MinopalCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
targets:
  Minopal:
    type: application
    platform: iOS
    sources:
      - path: Minopal
        excludes:
          - AppIcon.icon
      # アプリのアイコン（今の iOS 版の apps/ios/assets/app.icon と同じ。Icon Composer の形式で、古い iOS 用の画像は Xcode が作る）
      - path: Minopal/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MinopalCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
    # App Attest。値は production（TestFlight と App Store の配布用）。
    # path だけだと XcodeGen 2.46.0 が generate のたびに資格ファイルを空の辞書で上書きする（writePlists）。
    # 中身は properties に書く。開発ビルドは App Check のデバッグプロバイダなので、この資格で証明しない
    entitlements:
      path: Minopal/Minopal.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.minopal.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Minopal/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Minopal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - package: MinopalCore/MinopalCoreTests
        - MinopalUITests
        - MinopalTests
  # 画面を押して確かめるテスト。Firebase エミュレータ（npm run ios-swift:emulators）を起動してから、手元の Mac で流す（CI では流さない）
  MinopalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MinopalUITests
    dependencies:
      - target: Minopal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.minopal.app.uitests
  # Firestore の読み書き（Minopal/Data）を、Firebase エミュレータに対して確かめるテスト。手元の Mac で流す（CI では流さない）
  MinopalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MinopalTests
    dependencies:
      - target: Minopal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.minopal.app.tests
